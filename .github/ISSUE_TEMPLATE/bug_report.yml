name: Bug report
description: Report a problem with a plugin package
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much detail as you can.
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      placeholder: "@mxraven/react"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version, @mxraven/mail version, Node.js version, and framework version.
      placeholder: "@mxraven/react 0.0.1, @mxraven/mail 0.2.3, Node 22, React 19"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal snippet or steps to reproduce.
    validations:
      required: true
